name: Audiobook Factory (Sách nói)

on:
  schedule:
    - cron: "15,45 * * * *"      # tự kiểm tra SachNoi/_inbox mỗi 30 phút (lệch giờ với video danh nhân)
  workflow_dispatch:              # bấm "Run workflow" để chạy ngay

concurrency:
  group: audiobook
  cancel-in-progress: false

env:
  GDRIVE_CLIENT_JSON: ${{ secrets.GDRIVE_CLIENT_JSON }}
  GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
  VBEE_TOKEN: ${{ secrets.VBEE_TOKEN }}
  VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
  KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
  KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
  KLING_MODEL: ${{ vars.KLING_MODEL || 'kling-v2-1' }}        # Kling Image 2.1; đổi trong Settings → Variables
  KLING_RESOLUTION: ${{ vars.KLING_RESOLUTION || '2k' }}
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Dựng 1 tập sách nói
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Cài ffmpeg + font
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg fonts-dejavu-core fonts-noto-core > /dev/null
      - run: pip install -q -r requirements.txt
      - name: Dựng sách nói
        run: python -m factory.audiobook
